<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contatos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">

      <a href="#" class="logo" aria-label="Contatos">
        <div class="logo-icon">👤</div>
        <span class="logo-text">Conta<span>tos</span></span>
      </a>

      <div class="header-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="search"
          id="busca"
          placeholder="Buscar por nome, e-mail ou cidade…"
          autocomplete="off"
          aria-label="Buscar contatos"
        />
      </div>

      <button class="btn-primary" id="btn-novo-contato" aria-label="Adicionar novo contato">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Novo contato</span>
      </button>

    </div>
  </header>

  <main>

    <div class="status-bar">
      <h2>Todos os contatos</h2>
      <span id="contador">…</span>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <span>Carregando contatos…</span>
    </div>

    <!-- Grid -->
    <div id="lista-contatos" class="hidden" role="list" aria-label="Lista de contatos"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden" role="status">
      <div class="empty-icon">📋</div>
      <h3>Nenhum contato encontrado</h3>
      <p>Adicione seu primeiro contato clicando em "Novo contato".</p>
    </div>

  </main>

  <!--  Modal: Formulário -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-box">

      <div class="modal-header">
        <h2 id="modal-titulo">Novo Contato</h2>
        <button id="btn-fechar-modal" class="btn-icone" aria-label="Fechar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form id="form-contato" class="modal-form" novalidate>

        <!-- Nome (largura total) -->
        <div class="campo-grupo">
          <label for="campo-nome">Nome *</label>
          <input
            type="text"
            id="campo-nome"
            name="nome"
            placeholder="Ex: Maria Silva"
            autocomplete="name"
            required
          />
        </div>

        <!-- Celular + E-mail -->
        <div class="form-row">
          <div class="campo-grupo">
            <label for="campo-celular">Celular</label>
            <input
              type="tel"
              id="campo-celular"
              name="celular"
              placeholder="(11) 99999-9999"
              autocomplete="tel"
            />
          </div>
          <div class="campo-grupo">
            <label for="campo-email">E-mail</label>
            <input
              type="email"
              id="campo-email"
              name="email"
              placeholder="maria@email.com"
              autocomplete="email"
            />
          </div>
        </div>

        <!-- Foto (URL) -->
        <div class="campo-grupo">
          <label for="campo-foto">URL da Foto</label>
          <input
            type="url"
            id="campo-foto"
            name="foto"
            placeholder="https://exemplo.com/foto.jpg"
          />
        </div>

        <!-- Endereço + Cidade -->
        <div class="form-row">
          <div class="campo-grupo">
            <label for="campo-endereco">Endereço</label>
            <input
              type="text"
              id="campo-endereco"
              name="endereco"
              placeholder="Rua A, 100"
              autocomplete="street-address"
            />
          </div>
          <div class="campo-grupo">
            <label for="campo-cidade">Cidade</label>
            <input
              type="text"
              id="campo-cidade"
              name="cidade"
              placeholder="São Paulo"
              autocomplete="address-level2"
            />
          </div>
        </div>

        <div class="form-acoes">
          <button type="button" id="btn-cancelar" class="btn-ghost">Cancelar</button>
          <button type="submit" id="btn-salvar">Criar Contato</button>
        </div>

      </form>
    </div>
  </div>

  <!-- Modal: Confirmação de exclusão  -->
  <div id="confirm-dialog" class="confirm-overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-titulo">
    <div class="confirm-box">
      <div class="confirm-icon">🗑️</div>
      <h3 id="confirm-titulo">Excluir contato?</h3>
      <p>Tem certeza que deseja excluir <strong id="confirm-nome"></strong>? Esta ação não pode ser desfeita.</p>
      <div class="confirm-acoes">
        <button id="btn-confirmar-nao" class="btn-ghost">Cancelar</button>
        <button id="btn-confirmar-sim">Excluir</button>
      </div>
    </div>
  </div>

  <!-- Toast de notificação  -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script type="module" src="app.js"></script>

</body>
</html>
